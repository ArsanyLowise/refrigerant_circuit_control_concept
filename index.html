<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deployment model explorer</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#ffffff;--panel:#fff;--panel2:#fbfcfd;--ink:#17202a;--mut:#66748a;--line:#e3e7ec;--hover:#eef2f7;
  --canvas:#fff;--shadow:0 1px 2px rgba(15,25,40,.06),0 8px 24px rgba(15,25,40,.09);
}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
main{flex:1 1 auto;display:flex;min-height:0}
#stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--canvas)}
svg#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab;background:#fff}
svg#cv.grabbing{cursor:grabbing}
.float{position:absolute;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
#crumbs{top:11px;left:11px;max-width:calc(100% - 90px);padding:6px 9px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px}
#crumbs a{color:var(--mut);text-decoration:none;cursor:pointer;padding:1px 2px;border-radius:4px}
#crumbs a:hover{color:#3b6fd4;background:var(--hover)}
#crumbs .sep{color:#c8d0da}
#crumbs b{font-weight:600}
#zoom{top:11px;right:11px;display:flex;flex-direction:column;padding:3px}
#zoom button{width:30px;height:30px;border:0;background:none;border-radius:7px;cursor:pointer;font-size:15px;color:var(--ink);display:grid;place-items:center}
#zoom button:hover{background:var(--hover)}
/* --- Simulink drawing --- */
#cv .net{fill:none;stroke:#000;stroke-width:1;stroke-linejoin:round;stroke-linecap:butt;vector-effect:non-scaling-stroke}
#cv .nethit{fill:none;stroke:transparent;stroke-width:calc(11px / var(--k,1));pointer-events:stroke}
#cv .net.bus{stroke-width:3.2}
#cv .net.sel{stroke:#1a6dff;stroke-width:2.6}
#cv .net.traced{stroke:#1a6dff;stroke-width:1.6}
#cv .net.dim{opacity:.18}
#cv .blk{cursor:pointer}
#cv .body{stroke:#000;stroke-width:1;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
#cv .blk.sel .body{stroke:#1a6dff;stroke-width:3}
#cv .blk.traced .body{stroke:#1a6dff;stroke-width:2}
#cv .blk.dim{opacity:.22}
#cv .port{fill:#fff;stroke:#000;stroke-width:.8;vector-effect:non-scaling-stroke}
#cv .name{fill:#000;font-size:10px;paint-order:stroke;stroke:#fff;stroke-width:1.4px;stroke-linejoin:round}
#cv .pnum{fill:#000;font-size:6px;text-anchor:middle;dominant-baseline:central}
#cv .sig{fill:#000;font-size:8px;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:1.6px;stroke-linejoin:round}
#cv .code{fill:#7f7f7f;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:8px}
#cv{cursor:default;-webkit-user-select:none;user-select:none}
#cv .blk{cursor:move}
#cv .handle{fill:#fff;stroke:#1a6dff;stroke-width:1.6;vector-effect:non-scaling-stroke;cursor:grab}
#cv .snapring{fill:none;stroke:#12a150;stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none}
#cv .openend{fill:#fff;stroke:#c0392b;stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none}
#cv .wave{fill:none;stroke:#16202b;stroke-width:1.7;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
#cv .cbox{fill:#dbe7f4;stroke:#5c6b7a;stroke-width:1;vector-effect:non-scaling-stroke}
#cv .clabel{fill:#26313d;text-anchor:middle;dominant-baseline:central;font-family:Helvetica,Arial,sans-serif}
#cv .cwire{fill:none;stroke:#3c4a58;stroke-width:1;vector-effect:non-scaling-stroke}
#cv .cvalve{fill:#b0151b;stroke:#7d0d12;stroke-width:.7;vector-effect:non-scaling-stroke}
#cv .cvlabel{fill:#8a1016;text-anchor:middle;font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:1.6px;stroke-linejoin:round}
#cv text{dominant-baseline:central;font-family:Arial,Helvetica,sans-serif;pointer-events:none}
#cv .port{pointer-events:none}
</style>
</head>
<body>
<main>
  <section id="stage">
    <svg id="cv"></svg>
    <div id="crumbs" class="float"></div>
    <div id="zoom" class="float">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" title="Fit to window">⤢</button>
      <button id="zup" title="Go up one level">↑</button>
      <button id="zreset" title="Reset this system to the model's own layout">↺</button>
    </div>
  </section>
</main>

/* The model and its configuration subsystems all carry an "NN_" prefix. The
   explorer drops it, so the title, the tree and the block labels read
   "Deployment" and "sysconfig_1" … "sysconfig_9". */
const unNN = s => (typeof s === "string" ? s.replace(/^NN_(Deployment|sysconfig_\d+)$/i, "$1") : s);
M.name = unNN(M.name);
for (const ref in SYS) {
  const S = SYS[ref];
  S.name = unNN(S.name);
  S.path = S.path.map(unNN);
  for (const b of S.blocks) { b.n = unNN(b.n); if (b.d) b.d = unNN(b.d); }
}
for (const key of Object.keys(CODE)) {
  const nk = unNN(key);
  if (nk !== key) { CODE[nk] = CODE[key]; delete CODE[key]; }
}

for (const ref in SYS) {
  const S = SYS[ref];
  S.byId = Object.create(null);
  for (const b of S.blocks) S.byId[b.i] = b;
  S.tags = Object.create(null);
  for (const b of S.blocks) {
    const tg = b.pr.GotoTag || b.pr.Tag;
    if (!tg) continue;
    const e = S.tags[tg] || (S.tags[tg] = {g: [], f: []});
    if (b.t === "Goto") e.g.push(b.i);
    else if (b.t === "From") e.f.push(b.i);

/* ---------------- block geometry ---------------- */
function portPos(b, kind, idx) {
  const [l, t, r, bo] = b.p, h = bo - t;
  if (b.t === "Inport") return [r, t + h / 2];
  if (b.t === "Outport") return [l, t + h / 2];
  const n = Math.max((kind === "in" ? b.ni : b.no) || 1, 1);
  const x = kind === "in" ? (b.m ? r : l) : (b.m ? l : r);
  return [x, n > 1 ? t + h * idx / (n + 1) : t + h / 2];
}
function shapeOf(b) {
  if (b.t === "Gain") return "gain";
  if (b.t === "Sum" && (b.pr.IconShape || "round") === "round") return "circ";
  if (b.t === "Goto") return "goto";
  if (b.t === "From") return "from";
  return "rect";
}
function bodyPath(b) {
  const [l, t, r, bo] = b.p, h = bo - t, cy = t + h / 2;
  const s = shapeOf(b);
  if (s === "gain") return `M${l},${t} L${l},${bo} L${r},${cy} Z`;
  if (s === "goto") { const d = h / 2; return `M${l},${t} L${r - d},${t} L${r},${cy} L${r - d},${bo} L${l},${bo} Z`; }
  if (s === "from") { const d = h / 2; return `M${l + d},${t} L${r},${t} L${r},${bo} L${l + d},${bo} L${l},${cy} Z`; }
  return null;
}

function drawConcept(g, b, spec) {

  const [l, t, r, bo] = b.p, W = r - l, H = bo - t;
  const nS = spec.s.length;

  const condY1 = -88, condY2 = -52, condX1 = -140, condX2 = 16;
  const stageY0 = -14, stageH = 36, gap = 6;
  const stageAt = i => [stageY0 + i * (stageH + gap), stageY0 + i * (stageH + gap) + stageH];
  const lastBottom = stageAt(nS - 1)[1];
  const compX1 = 50, compX2 = 96, compY2 = stageY0 + stageH / 2;
  const left = -200, right = compX2, top = condY1 - 16, bottom = lastBottom + 18;

  const s = Math.min(W / (right - left + 26), H / (bottom - top + 26)) * 0.95;
  const px = d => (l + r) / 2 + (d - (left + right) / 2) * s;
  const py = d => (t + bo) / 2 + (d - (top + bottom) / 2) * s;
  const fs = 10 * s;
  const vh = 12 * s;
  const cg = mk("g", {class: "concept"});

  const cmpH = compY2 - condY1;

    cg.append(mk("rect", {class: "cbox", x: round(px(x1)), y: round(py(y1)),
      width: round((x2 - x1) * s), height: round((y2 - y1) * s), rx: round(3 * s)}));
    const cx = px((x1 + x2) / 2), cy = py((y1 + y2) / 2);
    const tx = mk("text", {class: "clabel", x: round(cx), y: round(cy),
      "font-size": round((rotated ? fs * 0.9 : fs) * 10) / 10});
    if (rotated) tx.setAttribute("transform", `rotate(-90 ${round(cx)} ${round(cy)})`);
    tx.textContent = label;
    cg.append(tx);
  };

  const wire = (pts, arrow) => {
    const d = pts.map((p, i) => (i ? "L" : "M") + round(px(p[0])) + "," + round(py(p[1]))).join(" ");
    const attrs = {class: "cwire", d};
    if (arrow) attrs["marker-end"] = "url(#arrow)";
    cg.append(mk("path", attrs));

  // triangle pointing down over one pointing up, with its tag to the upper right

    const cx = px(dx), cy = py(vy);
    cg.append(mk("path", {class: "cvalve", d: `M${round(cx - vh)},${round(cy - vh)} L${round(cx + vh)},${round(cy - vh)} L${round(cx)},${round(cy)} Z`}));

    tx.textContent = label;
    cg.append(tx);
  };

  const vxs = spec.v.length === 1 ? [-166] : [-178, -146];
  const condMid = (condY1 + condY2) / 2;
  const lastMidY = (stageAt(nS - 1)[0] + stageAt(nS - 1)[1]) / 2;

  spec.v.forEach((label, i) => {

    wire([[condX1, lastMidY], [vxs[i], lastMidY], [vxs[i], feed], [condX1, feed]], true);
  });
  wire([[condX2, condMid], [compX1, condMid]], true);
  wire([[73, compY2], [condX2, compY2]], true);
  for (let i = 1; i < nS; i++) {
    wire([[-62, stageAt(i - 1)[1]], [-62, stageAt(i)[0]]], true);
  }

  box(condX1, condY1, condX2, condY2, spec.c);
  box(compX1, condY1, compX2, condY1 + cmpH, "Compressor", true);
  spec.s.forEach((label, i) => box(condX1, stageAt(i)[0], condX2, stageAt(i)[1], label));
  spec.v.forEach((label, i) => valve(vxs[i], label, valveY));

  g.append(cg);
}

/* ---------------- render one system ---------------- */
function render() {
  const S = SYS[cur];
  gWires.textContent = ""; gBlocks.textContent = ""; gLabels.textContent = ""; defs.textContent = ""; gHandles.textContent = "";
  blockNodes = []; wireNodes = [];
  const arw = mk("marker", {id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7,
    markerHeight: 7, markerUnits: "userSpaceOnUse", orient: "auto"});
  arw.append(mk("path", {d: "M0,1 L9,5 L0,9 Z", fill: "#3c4a58"}));
  defs.append(arw);

  S.nets.forEach((n, i) => {
    n._i = i;
    // remember the model's own geometry so the layout can be reset
    if (!n._orig) n._orig = n.p.map(p => p.slice());
    if (n._s0 == null) { n._s0 = n.s; n._so0 = n.so; n._d0 = n.d; n._di0 = n.di; }
    if (n._bx == null) n._bx = n.p.length > 2 ? n.p[n.p.length - 2][0] : n.p[0][0] + 24;
    const d = n.p.map((p, j) => (j ? "L" : "M") + round(p[0]) + "," + round(p[1])).join(" ");
    const hit = mk("path", {d, class: "nethit"});
    hit.dataset.net = i;
    const path = mk("path", {d, class: n.b ? "net bus" : "net"});
    path.dataset.net = i;
    path._hit = hit;
    gWires.append(hit, path);
    wireNodes.push(path);
    if (n.open) {
      gWires.append(mk("circle", {class: "openend", cx: round(n.open.x), cy: round(n.open.y), r: round(4 / k)}));
    }
    if (n.n && n.p.length > 1) {
      // label the longest horizontal run, clipped to it so a long signal name
      // never runs across the next block
      let best = -1, bl = -1;
      for (let j = 1; j < n.p.length; j++) {
        if (Math.abs(n.p[j][1] - n.p[j - 1][1]) > 0.01) continue;
        const len = Math.abs(n.p[j][0] - n.p[j - 1][0]);
        if (len > bl) { bl = len; best = j; }
      }
      if (best > 0 && bl > 34) {
        const a = n.p[best - 1], c = n.p[best];
        const room = Math.floor((bl - 10) / 4.5);       // ~8px label font
        let txt = n.n;
        if (txt.length > room) txt = txt.slice(0, Math.max(2, room - 1)).replace(/[\s_,]+$/, "") + "\u2026";
        const t = mk("text", {class: "sig", x: round(Math.min(a[0], c[0]) + 5), y: round(a[1] - 6), "text-anchor": "start"});
        t.textContent = txt;
        if (txt !== n.n) { const tip = mk("title"); tip.textContent = n.n; t.append(tip); }
        gLabels.append(t);
      }
    }
  });

  for (const b of S.blocks) {
    const [l, t, r, bo] = b.p, w = r - l, h = bo - t;
    if (!b._op) b._op = b.p.slice();
    // a Mux or Bus Creator switched to the "bar" display option is drawn, as
    // Simulink draws it, as a solid black bar; a block holding a circuit diagram
    // keeps a pale body so its blue components stand out, every other block is
    // filled in the same soft blue
    const bar = b.pr && b.pr.DisplayOption === "bar";
    const fill = bar ? "#000" : (b.bg ? COL[b.bg] : (CONCEPT[b.n] ? "#f4f8fd" : BLOCK_FILL));
    const g = mk("g", {class: "blk"});
    g.dataset.b = b.i;
    const shape = shapeOf(b);
    const d = bodyPath(b);
    if (shape === "circ") {
      g.append(mk("circle", {class: "body", cx: (l + r) / 2, cy: (t + bo) / 2, r: Math.min(w, h) / 2, fill}));
    } else if (d) {
      g.append(mk("path", {class: "body", d, fill}));
    } else {
      g.append(mk("rect", {class: "body", x: l, y: t, width: Math.max(w, 1), height: Math.max(h, 1), fill}));
    }
    // the model's sensors and its outputs are all signals in their own right, so
    // both are drawn as a signal source with a waveform inside the block
    if ((b.t === "Inport" || b.t === "Outport") && cur === M.root && w >= 26 && h >= 12) {
      const cy0 = (t + bo) / 2;
      const x0 = l + Math.max(3, w * 0.12), x1 = r - Math.max(6, w * 0.18);
      const mid = (x0 + x1) / 2;
      const amp = Math.min(h * 0.36, 9);
      const q = (a, c) => round(a + (c - a) * 0.42);
      g.append(mk("path", {class: "wave",
        d: `M${round(x0)},${round(cy0)} C${q(x0, mid)},${round(cy0 - amp)} ${q(mid, x0)},${round(cy0 - amp)} ${round(mid)},${round(cy0)} ` +
           `C${q(mid, x1)},${round(cy0 + amp)} ${q(x1, mid)},${round(cy0 + amp)} ${round(x1)},${round(cy0)}`}));
    }

    const title = mk("title");
    title.textContent = `${b.d || b.n}\n${b.d ? "model name: " + b.n + "\n" : ""}${b.t}${b.sf ? " · " + b.sf : ""} · SID ${b.i}` + (b.c ? "\n(double-click to open)" : "");
    g.append(title);

    // ports: the little square markers Simulink draws on every block edge (a bar
    // has no block edge to mark, the wires simply meet it)
    const ps = clamp(Math.min(h * 0.22, w * 0.22), 3, 6);
    for (let i = 1; i <= b.ni && !bar; i++) {
      const [x, y] = portPos(b, "in", i);
      g.append(mk("rect", {class: "port", x: x - ps / 2, y: y - ps / 2, width: ps, height: ps}));
    }
    for (let i = 1; i <= b.no && !bar; i++) {
      const [x, y] = portPos(b, "out", i);
      g.append(mk("rect", {class: "port", x: x - ps / 2, y: y - ps / 2, width: ps, height: ps}));
    }

    // A network block shows the circuit it stands for; anything else that still
    // has a script keeps Simulink's inline code preview
    const code = CODE[b.n];
    const concept = CONCEPT[b.n];
    if (concept && w > 140 && h > 120) {
      drawConcept(g, b, concept);
    } else if (code && b.sf === "MATLAB Function" && h > 30) {
      const cid = "clip" + b.i;
      const cp = mk("clipPath", {id: cid});
      cp.append(mk("rect", {x: l + 1, y: t + 1, width: Math.max(w - 2, 1), height: Math.max(h - 2, 1)}));
      defs.append(cp);
      const cg = mk("g", {"clip-path": `url(#${cid})`});
      const lh = Math.max(9, Math.min(20, (h - 14) / code.length));
      code.forEach((line, i) => {
        const y = t + 8 + i * lh;
        if (y > bo - 10) return;
        const tx = mk("text", {class: "code", x: l + 6, y: round(y)});
        tx.textContent = line;
        cg.append(tx);
      });
      g.append(cg);
    }
    gBlocks.append(g);
    blockNodes.push(g);

    // block name, placed the way Simulink places it
    const nm = mk("text", {class: "name"});
    nm.textContent = b.d || b.n;
    // A name only goes inside when the box is a container wide enough to hold it;
    // otherwise it sits on the line under the block, which is where Simulink puts it.
    const nameW = (b.d || b.n).length * 5.6;
    const container = b.t === "Subsystem" || b.t === "ModelReference";
    const hasPreview = (!!concept && w > 140 && h > 120) || (!!code && b.sf === "MATLAB Function" && h > 30);
    if (b.t === "Inport") {
      nm.setAttribute("x", l - 4); nm.setAttribute("y", (t + bo) / 2); nm.setAttribute("text-anchor", "end");
    } else if (b.t === "Outport") {
      nm.setAttribute("x", r + 4); nm.setAttribute("y", (t + bo) / 2); nm.setAttribute("text-anchor", "start");
    } else if (b.nl === "top") {
      nm.setAttribute("x", (l + r) / 2); nm.setAttribute("y", t - 6); nm.setAttribute("text-anchor", "middle");
    } else if (b.nl === "right") {
      nm.setAttribute("x", r + 4); nm.setAttribute("y", (t + bo) / 2); nm.setAttribute("text-anchor", "start");
    } else if (b.nl === "left") {
      nm.setAttribute("x", l - 4); nm.setAttribute("y", (t + bo) / 2); nm.setAttribute("text-anchor", "end");
    } else if (container && !hasPreview && nameW <= w - 8) {
      nm.setAttribute("x", (l + r) / 2); nm.setAttribute("y", (t + bo) / 2); nm.setAttribute("text-anchor", "middle");
    } else {
      nm.setAttribute("x", (l + r) / 2); nm.setAttribute("y", bo + 11); nm.setAttribute("text-anchor", "middle");
    }
    g.append(nm);

    // Inport / Outport blocks show their port number inside
    if ((b.t === "Inport" || b.t === "Outport") && w > 12 && h > 9) {
      const num = mk("text", {class: "pnum", x: (l + r) / 2, y: (t + bo) / 2});
      num.textContent = b.pr.Port || "";
      g.append(num);
    }
  }
  applyT();
  paint();
  updateHandles();
  crumbs();
}

// Selection, tracing only touch classes so a clicked element stays in the DOM
function paint() {
  const S = SYS[cur];
  for (let i = 0; i < wireNodes.length; i++) {
    const n = S.nets[i];
    let cls = n.b ? "net bus" : "net";
    if (selNet === n) cls += " sel";
    else if (trace && trace.nets.has(n)) cls += " traced";
    if (trace && !trace.nets.has(n)) cls += " dim";
    wireNodes[i].setAttribute("class", cls);
  }
  for (const g of blockNodes) {
    const b = S.byId[g.dataset.b];
    let cls = "blk";
    if (sel === b.i) cls += " sel";
    else if (trace && trace.blocks.has(b.i)) cls += " traced";
    if (trace && !trace.blocks.has(b.i)) cls += " dim";
    g.setAttribute("class", cls);
  }
  updateHandles();
}

/* ---------------- view helpers ---------------- */
function bbox(S) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const b of S.blocks) {
    x0 = Math.min(x0, b.p[0]); y0 = Math.min(y0, b.p[1]);
    x1 = Math.max(x1, b.p[2]); y1 = Math.max(y1, b.p[3]);
  }
  if (!isFinite(x0)) return null;
  return [x0, y0, x1, y1];
}
// Fit the measured drawing extents (blocks, wires and the names that sit
// outside blocks), the way Simulink's own zoom-to-fit does.
function fit() {
  if (!gWorld.childElementCount) return;
  let bb = null;
  try { bb = gWorld.getBBox(); } catch (e) { bb = null; }
  if (!bb || !bb.width) {
    const b2 = bbox(SYS[cur]);
    if (!b2) return;
    bb = {x: b2[0], y: b2[1], width: b2[2] - b2[0], height: b2[3] - b2[1]};
  }
  const W = cv.clientWidth || 800, H = cv.clientHeight || 600, m = 22;
  k = clamp(Math.min((W - 2 * m) / Math.max(bb.width, 1), (H - 2 * m) / Math.max(bb.height, 1)), 0.02, 3);
  tx = W / 2 - (bb.x + bb.width / 2) * k;
  ty = H / 2 - (bb.y + bb.height / 2) * k;
  applyT();
  manual = false;
}
function centerOn(b, minK) {
  if (!b) return;
  k = Math.max(minK == null ? 0.85 : minK, k);
  tx = cv.clientWidth / 2 - (b.p[0] + b.p[2]) / 2 * k;
  ty = cv.clientHeight / 2 - (b.p[1] + b.p[3]) / 2 * k;
  applyT();
  manual = true;
}
function zoomAt(px, py, f) {
  manual = true;
  const k2 = clamp(k * f, 0.03, 16);
  tx = px - (px - tx) * (k2 / k);
  ty = py - (py - ty) * (k2 / k);
  k = k2;
  applyT();
}

/* ---------------- editing: move blocks, plug and unplug wires ---------------- */
let bd = null, ed = null;

function worldPt(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left - tx) / k, (e.clientY - r.top - ty) / k];
}
function portOf(b, kind, idx, off) {
  const [x, y] = portPos(b, kind, idx);
  return off && off.i === b.i ? [x + off.dx, y + off.dy] : [x, y];
}
// A wire that has been edited is re-routed the Simulink way: out of the port,
// one vertical channel, and straight into the destination port.
function routePoints(n, off) {
  const S = SYS[cur], sb = S.byId[n.s], db = S.byId[n.d];
  if (!sb || !db) return null;
  const st = n.open && n.open.end === "s" ? [n.open.x, n.open.y] : portOf(sb, "out", n.so, off);
  const dn = n.open && n.open.end === "d" ? [n.open.x, n.open.y] : portOf(db, "in", n.di, off);
  if (Math.abs(st[1] - dn[1]) < 0.5) return [st, dn];
  let x = n._bx == null ? st[0] + 24 : n._bx;
  x = clamp(x, Math.min(st[0], dn[0]), Math.max(st[0], dn[0]) + 260);
  return [st, [x, st[1]], [x, dn[1]], dn];
}
function setNetPath(i, pts) {
  const w = wireNodes[i];
  if (!w || !pts || pts.length < 2) return;
  const d = pts.map((p, j) => (j ? "L" : "M") + round(p[0]) + "," + round(p[1])).join(" ");
  w.setAttribute("d", d);
  if (w._hit) w._hit.setAttribute("d", d);
}
function beginBlockDrag(el, w) {
  const b = SYS[cur].byId[el.dataset.b];
  if (!b) return;
  bd = {el, b, w0: w, dx: 0, dy: 0, active: false,
        nets: SYS[cur].nets.filter(n => n.s === b.i || n.d === b.i)};
}
function moveBlock(w) {
  if (!bd) return;
  const dx = w[0] - bd.w0[0], dy = w[1] - bd.w0[1];
  if (!bd.active) {
    if (Math.hypot(dx, dy) * k < 3) return;
    bd.active = true;
  }
  bd.dx = dx; bd.dy = dy;
  bd.el.setAttribute("transform", `translate(${dx},${dy})`);
  const off = {i: bd.b.i, dx, dy};
  for (const n of bd.nets) setNetPath(n._i, routePoints(n, off));
}
function commitBlock() {
  const j = bd; bd = null;
  if (!j || !j.active) return false;
  j.b.p = [j.b.p[0] + j.dx, j.b.p[1] + j.dy, j.b.p[2] + j.dx, j.b.p[3] + j.dy];
  for (const n of j.nets) { const p = routePoints(n); if (p) n.p = p; }
  sel = j.b.i; selNet = null;
  render();
  return true;
}
function nearestPort(kind, w) {
  let best = null, dist = Infinity;
  for (const b of SYS[cur].blocks) {
    const n = (kind === "in" ? b.ni : b.no) || 0;
    for (let i = 1; i <= n; i++) {
      const p = portPos(b, kind, i);
      const d = Math.hypot(p[0] - w[0], p[1] - w[1]) * k;
      if (d < dist) { dist = d; best = {b, idx: i, pt: p}; }
    }
  }
  return dist <= 15 ? best : null;
}
function beginEndDrag(handle, w) {
  ed = {n: selNet, end: handle.dataset.end, pos: w.slice(), snap: null, moved: false};
}
function moveEnd(w) {
  if (!ed) return;
  ed.moved = true;
  ed.pos = w;
  ed.snap = nearestPort(ed.end === "d" ? "in" : "out", w);
  const n = ed.n, keep = n.open;
  n.open = {end: ed.end, x: w[0], y: w[1]};
  setNetPath(n._i, routePoints(n));
  n.open = keep;
  updateHandles();
}
function commitEnd() {
  const j = ed; ed = null;
  if (!j || !j.moved) { updateHandles(); return; }
  const n = j.n;
  if (j.snap) {
    if (j.end === "d") { n.d = j.snap.b.i; n.di = j.snap.idx; }
    else { n.s = j.snap.b.i; n.so = j.snap.idx; }
    n.open = null;
  } else {
    n.open = {end: j.end, x: j.pos[0], y: j.pos[1]};
  }
  n.p = routePoints(n) || n.p;
  render();
}
function updateHandles() {
  gHandles.textContent = "";
  if (selNet && selNet.p && selNet.p.length > 1) {
    const ends = [[selNet.p[0], "s"], [selNet.p[selNet.p.length - 1], "d"]];
    for (const [pt, which] of ends) {
      gHandles.append(mk("circle", {class: "handle", cx: round(pt[0]), cy: round(pt[1]),
        r: round(5.5 / k), "data-end": which}));
    }
  }
  if (ed && ed.snap) {
    gHandles.append(mk("circle", {class: "snapring", cx: round(ed.snap.pt[0]),
      cy: round(ed.snap.pt[1]), r: round(9 / k)}));
  }
}
function resetLayout() {
  const S = SYS[cur];
  for (const b of S.blocks) if (b._op) b.p = b._op.slice();
  for (const n of S.nets) {
    if (n._orig) n.p = n._orig.map(p => p.slice());
    n.open = null;
    n.s = n._s0; n.so = n._so0; n.d = n._d0; n.di = n._di0;
  }
  render();
}

/* ---------------- interaction ---------------- */
const pts = new Map();
let drag = null, pinch = null;
cv.addEventListener("pointerdown", e => {
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
  pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pts.size === 1) {
    const t = e.target, w = worldPt(e);
    const handle = t.closest ? t.closest(".handle") : null;
    const blkEl = t.closest ? t.closest("g.blk") : null;
    if (handle && selNet) { beginEndDrag(handle, w); drag = {kind: "end", moved: 0}; }
    else if (blkEl) { beginBlockDrag(blkEl, w); drag = {kind: "block", moved: 0}; }
    else drag = {kind: "pan", x: e.clientX, y: e.clientY, tx, ty, moved: 0};
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), k};
    drag = null;
    cv.classList.add("grabbing");
  }
});
cv.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pts.size >= 2 && pinch) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch.d > 0) {
      const rect = cv.getBoundingClientRect();
      zoomAt((a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top, (pinch.k * (d / pinch.d)) / k);
    }
    return;
  }
  if (!drag) return;
  if (drag.kind === "end") { moveEnd(worldPt(e)); return; }
  if (drag.kind === "block") { moveBlock(worldPt(e)); return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
  if (drag.moved > 3) { cv.classList.add("grabbing"); manual = true; }
  tx = drag.tx + dx; ty = drag.ty + dy;
  applyT();
});
function endPointer(e) {
  const d = drag;
  const moved = d ? d.moved : 99;
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  cv.classList.remove("grabbing");
  if (pts.size) return;
  drag = null;
  if (d && d.kind === "end") { commitEnd(); return; }
  if (d && d.kind === "block") { if (!commitBlock()) clickAt(e); return; }
  if (moved < 5) clickAt(e);
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", e => { pts.delete(e.pointerId); drag = null; pinch = null; cv.classList.remove("grabbing"); });

function clickAt(e) {
  const el = nodeAt(e);
  if (!el) { sel = null; selNet = null; trace = null; paint(); return; }
  if (el.dataset.net != null) { selNet = SYS[cur].nets[+el.dataset.net]; sel = null; }
  else { sel = el.dataset.b; selNet = null; }
  trace = null;
  paint();
}
cv.addEventListener("dblclick", e => {
  const el = nodeAt(e);
  if (!el || !el.dataset.b) return;
  const b = SYS[cur].byId[el.dataset.b];
  if (b && b.c) openSystem(b.c);
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016));
}, {passive: false});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { sel = null; selNet = null; trace = null; paint(); }
});

/* ---------------- navigation ---------------- */
function openSystem(ref, blockId) {
  if (!SYS[ref]) return;
  cur = ref; sel = blockId || null; selNet = null; trace = null;
  if (location.hash.slice(1) !== ref) history.replaceState(null, "", "#" + ref);
  render();
  fit();
  if (blockId) centerOn(SYS[ref].byId[blockId]);
}
function crumbs() {
  const S = SYS[cur], el = document.getElementById("crumbs");
  el.innerHTML = "";
  S.path.forEach((p, i) => {
    if (i) el.append(Object.assign(document.createElement("span"), {className: "sep", textContent: "/"}));
    let ref = null;
    for (const r in SYS) if (SYS[r].name === p && SYS[r].path.length === i + 1) { ref = r; break; }
    if (ref && ref !== cur) {
      const a = document.createElement("a");
      a.textContent = p; a.onclick = () => openSystem(ref);
      el.append(a);
    } else {
      const b = document.createElement("b");
      b.textContent = p;
      el.append(b);
    }
  });
}

/* ---------------- chrome ---------------- */
document.title = M.name + " block diagram";
document.getElementById("zin").onclick = () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1.3);
document.getElementById("zout").onclick = () => zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1 / 1.3);
document.getElementById("zreset").onclick = () => resetLayout();
document.getElementById("zfit").onclick = fit;

  if (S.path.length <= 1) return;
  for (const r in SYS) {
    const T = SYS[r];
    if (T.path.length === S.path.length - 1 && S.path.slice(0, -1).join("/") === T.path.join("/")) { openSystem(r); return; }
  }
};
new ResizeObserver(() => { if (!manual) fit(); }).observe(document.getElementById("stage"));

/* ---------------- boot ---------------- */
const startRef = location.hash.slice(1);
cur = SYS[startRef] ? startRef : M.root;
render();
fit();
</script>
</body>
